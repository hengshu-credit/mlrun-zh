kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0
    extraPortMappings:
      - containerPort: 30060
        hostPort: 8080
        listenAddress: "127.0.0.1"
      - containerPort: 30068
        hostPort: 4000
        listenAddress: "127.0.0.1"
      - containerPort: 30040
        hostPort: 8888
        listenAddress: "127.0.0.1"
