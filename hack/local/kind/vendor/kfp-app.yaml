          name: http
        - containerPort: 8887
          name: grpc
        readinessProbe:
          httpGet:
            path: /apis/v1beta1/healthz
            port: 8888
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          requests:
            cpu: 250m
            memory: 500Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 0
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          failureThreshold: 12
          httpGet:
            path: /apis/v1beta1/healthz
            port: 8888
          periodSeconds: 5
          timeoutSeconds: 2
        volumeMounts:
        - mountPath: /etc/mlflow-tracking-ca
          name: mlflow-tracking-ca
          readOnly: true
      initContainers:
      - args:
        - "if [ -z \"${WAIT_HOST}\" ] || [ -z \"${WAIT_PORT}\" ]; then\n  echo \"\
          ERROR: WAIT_HOST or WAIT_PORT is not set.\"\n  exit 1\nfi\nMAX_RETRIES=60;\
          \ i=0\nwhile ! nc -z -w 2 \"${WAIT_HOST}\" \"${WAIT_PORT}\"; do\n  i=$((i+1))\n\
          \  if [ \"$i\" -ge \"$MAX_RETRIES\" ]; then\n    echo \"ERROR: Timed out\
          \ waiting for ${WAIT_HOST}:${WAIT_PORT} after ${MAX_RETRIES} attempts.\"\
          \n    exit 1\n  fi\n  echo \"Waiting for ${WAIT_HOST}:${WAIT_PORT} (attempt\
          \ ${i}/${MAX_RETRIES})...\"\n  sleep 5\ndone\n"
