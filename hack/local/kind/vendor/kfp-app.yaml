apiVersion: v1
data:
  defaultPipelineRoot: minio://mlpipeline/v2/artifacts
  providers: "minio:\n  default:\n    credentials:\n      fromEnv: false\n      secretRef:\n\
    \        accessKeyKey: accesskey\n        secretKeyKey: secretkey\n        secretName:\
    \ mlpipeline-minio-artifact\n    disableSSL: true\n    endpoint: minio-service.mlrun.svc.cluster.local:9000\n\
    \    region: us-east-1\n"
kind: ConfigMap
metadata:
  labels:
    application-crd-id: kubeflow-pipelines
  name: kfp-launcher
  namespace: mlrun
---
apiVersion: v1
data:
  kubeflow_pipelines_version: v2.17.2
kind: ConfigMap
metadata:
  labels:
    application-crd-id: kubeflow-pipelines
  name: kubeflow-pipelines-public
  namespace: mlrun
---
apiVersion: v1
data:
  envoy-config.yaml: "admin:\n  access_log:\n    name: admin_access\n    typed_config:\n\
    \      \"@type\": type.googleapis.com/envoy.extensions.access_loggers.file.v3.FileAccessLog\n\
    \      path: /tmp/admin_access.log\n  address:\n    socket_address: { address:\
    \ 0.0.0.0, port_value: 9901 }\n\nstatic_resources:\n  listeners:\n    - name:\
    \ listener_0\n      address:\n        socket_address: { address: 0.0.0.0, port_value:\
    \ 9090 }\n      filter_chains:\n        - filters:\n            - name: envoy.filters.network.http_connection_manager\n\
    \              typed_config:\n                \"@type\": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager\n\
    \                codec_type: auto\n                stat_prefix: ingress_http\n\
    \                route_config:\n                  name: local_route\n        \
    \          virtual_hosts:\n                    - name: local_service\n       \
    \               domains: [ \"*\" ]\n                      routes:\n          \
    \              - match: { prefix: \"/\" }\n                          route:\n\
    \                            cluster: metadata-cluster\n                     \
    \       max_stream_duration:\n                              grpc_timeout_header_max:\
    \ '0s'\n                          typed_per_filter_config:\n                 \
    \           envoy.filter.http.cors:\n                              \"@type\":\
    \ type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy\n     \
    \                         allow_origin_string_match:\n                       \
    \         - safe_regex:\n                                    regex: \".*\"\n \
    \                             allow_methods: GET, PUT, DELETE, POST, OPTIONS\n\
    \                              allow_headers: keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,custom-header-1,x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,x-grpc-web,grpc-timeout\n\
    \                              max_age: \"1728000\"\n                        \
    \      expose_headers: custom-header-1,grpc-status,grpc-message\n            \
    \    http_filters:\n                  - name: envoy.filters.http.grpc_web\n  \
    \                  typed_config:\n                      \"@type\": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb\n\
    \                  - name: envoy.filters.http.cors\n                    typed_config:\n\
    \                      \"@type\": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors\n\
    \                  - name: envoy.filters.http.router\n                    typed_config:\n\
    \                      \"@type\": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router\n\
    \  clusters:\n    - name: metadata-cluster\n      connect_timeout: 30.0s\n   \
    \   type: logical_dns\n      typed_extension_protocol_options:\n        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:\n\
    \          \"@type\": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions\n\
    \          explicit_http_config:\n            http2_protocol_options: { }\n  \
    \    lb_policy: round_robin\n      load_assignment:\n        cluster_name: metadata-grpc\n\
    \        endpoints:\n          - lb_endpoints:\n              - endpoint:\n  \
