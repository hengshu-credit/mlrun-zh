apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: mlrun-otel
  namespace: mlrun
spec:
  mode: deployment
  image: otel/opentelemetry-collector-contrib:0.160.0
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 400
      batch: {}
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
      debug:
        verbosity: basic
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mlrun-otel
  namespace: mlrun
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mlrun-otel-collector
  podMetricsEndpoints:
    - port: prometheus
      interval: 30s
