# Included inside the upstream server; API and Nuclio proxy locations stay upstream.
location = / {
  absolute_redirect off;
  add_header Cache-Control "no-store" always;
  return 302 /mlrun/projects$is_args$args;
}

location = /index.html {
  root /usr/share/nginx/html;
  add_header Cache-Control "no-store" always;
  etag off;
  if_modified_since off;
}

location = /config.json {
  root /usr/share/nginx/html;
  add_header Cache-Control "no-store" always;
  etag off;
  if_modified_since off;
}

# One-time migration for browsers that already cached an older root document.
# Clear HTTP cache only; preserve language, sidebar settings, cookies and storage.
location = /ui-refresh {
  absolute_redirect off;
  add_header Cache-Control "no-store" always;
  add_header Clear-Site-Data '"cache"' always;
  return 302 /mlrun/projects$is_args$args;
}
