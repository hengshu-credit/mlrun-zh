# Local single-node Kubernetes deployment. See README.zh-CN.md.
apiVersion: v1
kind: Namespace
metadata:
  name: mlrun
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlrun-db
  namespace: mlrun
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlrun-data
  namespace: mlrun
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlrun-api
  labels:
    app: mlrun-api
  namespace: mlrun
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlrun-api
  template:
    metadata:
      labels:
        app: mlrun-api
    spec:
      containers:
      - name: mlrun-api
        image: mlrun/mlrun-api:1.7.0
        env:
        - name: MLRUN_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: MLRUN_HTTPDB__DB_TYPE
          value: sqldb
        - name: MLRUN_HTTPDB__DSN
          value: sqlite:////mlrun/db/mlrun.db?check_same_thread=false
        - name: MLRUN_HTTPDB__LOGS_PATH
          value: /mlrun/db/logs
        - name: MLRUN_HTTPDB__DATA_VOLUME
          value: /home/jovyan/data
        - name: MLRUN_HTTPDB__CLUSTERIZATION__CHIEF__SERVICE
          value: mlrun-api
        - name: MLRUN_HTTPDB__API_URL
          value: http://mlrun-api:8080
        - name: MLRUN_ARTIFACT_PATH
          value: /home/jovyan/data
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: db
          mountPath: /mlrun/db
        - name: storage
          mountPath: /home/jovyan/data
        imagePullPolicy: IfNotPresent
        readinessProbe:
          httpGet:
            path: /api/healthz
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /api/healthz
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
      volumes:
      - name: db
        persistentVolumeClaim:
          claimName: mlrun-db
      - name: storage
        persistentVolumeClaim:
          claimName: mlrun-data
      serviceAccountName: mlrun-api
  strategy:
    type: Recreate
---
kind: Service
apiVersion: v1
metadata:
  name: mlrun-api
  namespace: mlrun
spec:
  type: NodePort
  selector:
    app: mlrun-api
  ports:
  - protocol: TCP
    nodePort: 30060
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlrun-ui
  labels:
    app: mlrun-ui
  namespace: mlrun
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlrun-ui
  template:
    metadata:
      labels:
        app: mlrun-ui
    spec:
      containers:
      - name: mlrun-ui
        image: mlrun/mlrun-ui:1.7.0
        env:
        - name: MLRUN_API_PROXY_URL
          value: http://mlrun-api.mlrun.svc.cluster.local:8080
        ports:
        - containerPort: 8090
        imagePullPolicy: IfNotPresent
        readinessProbe:
          httpGet:
            path: /
            port: 8090
          periodSeconds: 10
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /
            port: 8090
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
  strategy:
    type: Recreate
---
kind: Service
apiVersion: v1
metadata:
  name: mlrun-ui
  namespace: mlrun
spec:
  type: NodePort
  selector:
    app: mlrun-ui
  ports:
  - protocol: TCP
    nodePort: 30068
    port: 80
    targetPort: 8090
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlrun-api
  namespace: mlrun
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlrun-api-role
  namespace: mlrun
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - pods/exec
  - pods/log
  - services
  - secrets
  - configmaps
  - serviceaccounts
  - events
  - persistentvolumeclaims
  verbs:
  - '*'
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - '*'
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - '*'
- apiGroups:
  - kubeflow.org
  resources:
  - mpijobs
  verbs:
  - '*'
- apiGroups:
  - sparkoperator.k8s.io
  resources:
  - sparkapplications
  - scheduledsparkapplications
  verbs:
  - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlrun-api-binding
  namespace: mlrun
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mlrun-api-role
subjects:
- kind: ServiceAccount
  name: mlrun-api
  namespace: mlrun
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jupyter-role
  namespace: mlrun
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - pods/exec
  - pods/log
  - services
  - secrets
  - configmaps
  - serviceaccounts
  - events
  - persistentvolumeclaims
  verbs:
  - '*'
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - '*'
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - '*'
- apiGroups:
  - kubeflow.org
  resources:
  - mpijobs
  verbs:
  - '*'
- apiGroups:
  - sparkoperator.k8s.io
  resources:
  - sparkapplications
  - scheduledsparkapplications
  verbs:
  - '*'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jupyter
  namespace: mlrun
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jupyter-mlrun-executor
  namespace: mlrun
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jupyter-role
subjects:
- kind: ServiceAccount
  name: jupyter
  namespace: mlrun
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter-notebook
  labels:
    app: jupyter-notebook
  namespace: mlrun
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter-notebook
  template:
    metadata:
      labels:
        app: jupyter-notebook
    spec:
      containers:
      - name: jupyter-notebook
        image: mlrun/jupyter:1.7.0
        env:
        - name: MLRUN_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: MLRUN_DBPATH
          value: http://mlrun-api:8080
        - name: MLRUN_ARTIFACT_PATH
          value: /home/jovyan/data
        volumeMounts:
        - mountPath: /home/jovyan/data
          name: storage
        ports:
        - containerPort: 8888
        command:
        - start-notebook.sh
        args:
        - --ip=0.0.0.0
        - --port=8888
        - --NotebookApp.token=
        - --NotebookApp.password=
        - --NotebookApp.default_url=/lab
        imagePullPolicy: IfNotPresent
        readinessProbe:
          httpGet:
            path: /
            port: 8888
          periodSeconds: 10
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /
            port: 8888
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: mlrun-data
      serviceAccountName: jupyter
  strategy:
    type: Recreate
---
kind: Service
apiVersion: v1
metadata:
  name: jupyter-notebook
  namespace: mlrun
spec:
  type: NodePort
  selector:
    app: jupyter-notebook
  ports:
  - protocol: TCP
    nodePort: 30040
    port: 8888
    targetPort: 8888
