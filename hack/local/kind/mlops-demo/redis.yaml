apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlrun-feature-redis
  namespace: mlrun
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlrun-feature-redis
  namespace: mlrun
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlrun-feature-redis
  template:
    metadata:
      labels:
        app: mlrun-feature-redis
    spec:
      containers:
      - name: redis
        image: redis:7.4.11-alpine
        args: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mlrun-feature-redis
---
apiVersion: v1
kind: Service
metadata:
  name: mlrun-feature-redis
  namespace: mlrun
spec:
  selector:
    app: mlrun-feature-redis
  ports:
  - port: 6379
    targetPort: 6379
