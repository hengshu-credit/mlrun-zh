apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlrun-registry
  namespace: mlrun
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlrun-registry
  namespace: mlrun
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlrun-registry
  template:
    metadata:
      labels:
        app: mlrun-registry
    spec:
      containers:
        - name: registry
          image: registry:3.1.1
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
          volumeMounts:
            - name: storage
              mountPath: /var/lib/registry
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: mlrun-registry
---
apiVersion: v1
kind: Service
metadata:
  name: mlrun-registry
  namespace: mlrun
spec:
  selector:
    app: mlrun-registry
  ports:
    - port: 5000
      targetPort: 5000
